# Model capability matrix — read by stage 9 (model pick + routing) and stages 7/8 (image models).
# Values marked verify:true are unaudited against the live Higgsfield catalog — audit at M2/M6
# (list models via MCP, check params) and remove the flag once confirmed.
# POLICY: a scene containing dialogue may only be generated by a video model whose entry
# satisfies every capability in policy.dialogue_scene_requires.

version: 1

policy:
  dialogue_scene_requires: [native_voice, quoted_dialogue_lipsync, reference_audio]
  no_external_tts_lipsync: true      # v1 decision — no TTS/lipsync fallback path

video_models:
  seedance-2.0:
    gateway: higgsfield
    modes: [t2v, i2v, ref2v]
    native_voice: true
    quoted_dialogue_lipsync: true
    reference_audio: true            # per-character locked voice sample conditioning — VERIFY at M2
    reference_images_max: 9
    reference_videos_max: 3
    start_end_frames: true
    multi_shot: true
    max_clip_seconds: 15
    resolutions: [720p, 1080p]
    aspects: ["16:9", "9:16", "1:1"]
    prompt_words: [200, 400]
    cost_per_second_usd: 0.30
    skill: seedance-prompting
    verify: true
    use_for: [dialogue, action, establishing]   # the default for everything

  seedance-2.0-fast:
    gateway: higgsfield
    modes: [t2v, i2v, ref2v]
    native_voice: true
    quoted_dialogue_lipsync: true
    reference_audio: true
    reference_images_max: 9
    start_end_frames: true
    max_clip_seconds: 15
    aspects: ["16:9", "9:16", "1:1"]
    prompt_words: [200, 400]
    cost_per_second_usd: 0.12
    camera_fidelity: reduced
    skill: seedance-prompting
    verify: true
    use_for: [drafts, qc_retries]

  kling-2.5:
    gateway: higgsfield
    modes: [t2v, i2v]
    native_voice: false
    quoted_dialogue_lipsync: false
    reference_audio: false
    start_end_frames: true
    max_clip_seconds: 10
    aspects: ["16:9", "9:16", "1:1"]
    prompt_words: [60, 200]
    cost_per_second_usd: 0.25
    skill: ai-video-gen
    verify: true
    use_for: [action, establishing, stylized_motion]

  veo-3:
    gateway: higgsfield
    modes: [t2v, i2v]
    native_voice: true               # generates audio, but NOT conditioned on a reference voice
    quoted_dialogue_lipsync: partial
    reference_audio: false           # → fails dialogue policy: no voice lock possible
    start_end_frames: false
    max_clip_seconds: 8
    aspects: ["16:9", "9:16"]
    prompt_words: [100, 250]
    cost_per_second_usd: 0.40
    skill: ai-video-gen
    verify: true
    use_for: [photoreal_establishing, ambience]

  sora-2:
    gateway: higgsfield
    modes: [t2v, i2v]
    native_voice: true
    quoted_dialogue_lipsync: partial
    reference_audio: false           # → fails dialogue policy
    start_end_frames: false
    max_clip_seconds: 10
    aspects: ["16:9", "9:16"]
    prompt_words: [100, 250]
    cost_per_second_usd: 0.50
    skill: ai-video-gen
    verify: true
    use_for: [surreal, complex_physics, establishing]

image_models:
  nano-banana:
    gateway: google
    multi_image_refs: true
    skill: character-sheets
    use_for: [character_sheets, consistency_edits, storyboard_frames]

  higgsfield-image:
    gateway: higgsfield
    multi_image_refs: true
    skill: storyboard-design
    verify: true
    use_for: [environment_plates, storyboard_frames, style_frames]

  flux:
    gateway: bfl
    optional: true
    skill: storyboard-design
    use_for: [style_frames]

voice_models:
  elevenlabs:
    gateway: elevenlabs
    skill: elevenlabs
    use_for: [voice_design, character_reference_samples]
    output_convention: assets/voices/<char_id>_<variant_id>.mp3
