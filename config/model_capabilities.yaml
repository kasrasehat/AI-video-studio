# Model capability matrix — read by stage 9 (model pick + routing) and stages 7/8 (image models).
# AUDITED against the live Higgsfield MCP catalog on 2026-07-11 (models_explore). Model ids are
# the real catalog ids. verify:true now marks only what the catalog could NOT confirm (e.g.
# lipsync quality) — audit those with cheap live generations at M6.
# Costs are in Higgsfield credits and vary per model/params: ALWAYS preflight with
# generate_video/generate_image `get_cost: true` and announce before batches.
# POLICY: a scene containing dialogue may only be generated by a video model whose entry
# satisfies every capability in policy.dialogue_scene_requires.
# NOTE: Sora is NOT available in the Higgsfield catalog (checked 2026-07-11).

version: 2

policy:
  dialogue_scene_requires: [native_voice, quoted_dialogue_lipsync, reference_audio]
  no_external_tts_lipsync: true      # v1 decision — voice lock = reference_audio conditioning

video_models:
  seedance_2_0:                      # DEFAULT — the only fully-verified dialogue model
    gateway: higgsfield
    native_voice: true               # generate_audio param (default true, independent of audio refs)
    quoted_dialogue_lipsync: true    # per Seedance prompting canon; audit output quality at M6
    reference_audio: true            # medias role audio_references — THE voice lock (verified in catalog)
    media_roles: [start_image, end_image, image_references, video_references, audio_references]
    reference_images_max: 9
    start_end_frames: true
    multi_shot: true
    duration_seconds: {min: 4, max: 15}
    resolutions: [480p, 720p, 1080p, 4k]   # 1080p/4k require mode std
    params: {mode: [std, fast], bitrate_mode: [standard, high], genre: [auto, action, horror, comedy, noir, drama, epic]}
    aspects: ["auto", "16:9", "9:16", "4:3", "3:4", "1:1", "21:9"]
    prompt_words: [200, 400]
    skill: seedance-prompting
    use_for: [dialogue, action, establishing]

  seedance_2_0_mini:                 # fast/budget variant — SAME reference roles incl. audio
    gateway: higgsfield
    native_voice: true
    quoted_dialogue_lipsync: true
    reference_audio: true
    media_roles: [start_image, end_image, image_references, video_references, audio_references]
    reference_images_max: 9
    start_end_frames: true
    duration_seconds: {min: 4, max: 15}
    resolutions: [480p, 720p]
    aspects: ["auto", "16:9", "9:16", "4:3", "3:4", "1:1", "21:9"]
    prompt_words: [200, 400]
    skill: seedance-prompting
    use_for: [drafts, qc_retries, storyboard_previews]

  wan2_7:                            # possible SECOND dialogue model — lipsync quality unverified
    gateway: higgsfield
    native_voice: true               # "synchronized audio, character-consistent"
    quoted_dialogue_lipsync: verify  # NOT true until an M6 test clip proves it
    reference_audio: true            # audio_references role verified in catalog
    media_roles: [start_image, end_image, audio_references]
    start_end_frames: true
    duration_seconds: {min: 2, max: 15}
    resolutions: [720p, 1080p]
    aspects: ["16:9", "9:16", "1:1", "4:3", "3:4"]
    skill: ai-video-gen
    verify: true
    use_for: [dialogue_candidate, character_action]

  kling3_0:
    gateway: higgsfield
    native_voice: true               # sound on/off — but NO audio reference → no voice lock
    quoted_dialogue_lipsync: false
    reference_audio: false
    media_roles: [start_image, end_image]
    start_end_frames: true
    duration_seconds: {min: 3, max: 15}
    params: {mode: [std, pro, 4k]}
    aspects: ["16:9", "9:16", "1:1"]
    prompt_words: [60, 200]
    skill: ai-video-gen
    use_for: [action, motion_transfer, multi_shot_non_dialogue]

  kling3_0_turbo:
    gateway: higgsfield
    native_voice: false
    quoted_dialogue_lipsync: false
    reference_audio: false
    media_roles: [start_image]
    start_end_frames: false
    duration_seconds: {min: 3, max: 15}
    resolutions: [720p, 1080p]
    aspects: ["16:9", "9:16", "1:1"]
    skill: ai-video-gen
    use_for: [fast_drafts, establishing]

  veo3_1:
    gateway: higgsfield
    native_voice: true               # audio tag — but no audio reference → fails dialogue policy
    quoted_dialogue_lipsync: partial
    reference_audio: false
    media_roles: [start_image]
    start_end_frames: false
    duration_seconds: {options: [4, 6, 8]}
    params: {quality: [basic, high, ultra], variant: [veo-3-1-preview, veo-3-1-fast]}
    aspects: ["16:9", "9:16"]
    prompt_words: [100, 250]
    skill: ai-video-gen
    use_for: [photoreal_establishing, ambience]

  veo3_1_lite:
    gateway: higgsfield
    native_voice: false              # generate_audio default false, costs extra
    quoted_dialogue_lipsync: false
    reference_audio: false
    media_roles: [start_image, end_image]
    start_end_frames: true
    duration_seconds: {options: [4, 6, 8]}
    aspects: ["16:9", "9:16", "auto"]
    skill: ai-video-gen
    use_for: [budget_batch, establishing]

  cinematic_studio_3_0:              # Higgsfield's own cinema-grade model
    gateway: higgsfield
    native_voice: true               # generate_audio (default false)
    quoted_dialogue_lipsync: false
    reference_audio: false
    media_roles: [image, start_image, end_image]
    start_end_frames: true
    duration_seconds: {min: 4, max: 15}
    resolutions: [480p, 720p, 1080p, 4k]
    params: {genre: [auto, action, horror, comedy, noir, drama, epic]}
    aspects: ["auto", "21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
    skill: ai-video-gen
    verify: true
    use_for: [cinematic_non_dialogue, hero_establishing]

  minimax_hailuo:
    gateway: higgsfield
    native_voice: false
    quoted_dialogue_lipsync: false
    reference_audio: false
    media_roles: [start_image, end_image]
    start_end_frames: true
    duration_seconds: {options: [6, 10]}
    skill: ai-video-gen
    use_for: [facial_emotion_silent, natural_physics]

image_models:
  nano_banana_pro:
    gateway: higgsfield
    multi_image_refs: true
    strengths: [4k, text_rendering, diagrams, character_refs]
    skill: character-sheets
    use_for: [character_sheets, consistency_edits, storyboard_frames]

  soul_2:
    gateway: higgsfield
    multi_image_refs: true
    strengths: [portraits, fashion, editorial, character_refs]
    skill: character-sheets
    verify: true                     # params/roles to inspect at M4
    use_for: [character_sheets, environment_plates]
    note: "Higgsfield 'Soul' also supports TRAINED reusable characters (5-20 photos via show_characters action=train) — candidate v2 upgrade of the character lock."

  higgsfield_image:
    gateway: higgsfield
    skill: storyboard-design
    verify: true                     # exact catalog id + params to confirm at M4 (models_explore type=image)
    use_for: [environment_plates, storyboard_frames, style_frames]

  flux:
    gateway: bfl
    optional: true
    skill: flux-bfl
    use_for: [style_frames]

voice_models:
  elevenlabs:
    gateway: elevenlabs
    skill: elevenlabs
    use_for: [voice_design, character_reference_samples]
    output_convention: assets/voices/<char_id>_<variant_id>.mp3
    note: "Designed sample is uploaded via media_upload/media_import_url -> media_id -> passed as audio_references on every clip where the character speaks."
  higgsfield_voice:
    gateway: higgsfield
    skill: higgsfield-mcp
    verify: true
    use_for: [voice_alternative]
    note: "Native voices via create_voice / list_voices + generate_audio — alternative voice-sample path, evaluate at M4."

post_models:                          # stage 10 polish — server-side, discovered in audit
  topaz_video:        {gateway: higgsfield, skill: higgsfield-mcp, use_for: [upscale_1080p_2160p], verify: true}
  bytedance_video_upscale: {gateway: higgsfield, skill: higgsfield-mcp, use_for: [upscale_aigc_preset, fps_24_60], verify: true}
  video_deflicker:    {gateway: higgsfield, skill: higgsfield-mcp, use_for: [flicker_repair], verify: true}
