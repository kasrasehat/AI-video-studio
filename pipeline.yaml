# full-ai-video-system — the film pipeline manifest.
# SINGLE SOURCE OF TRUTH for stage order, artifacts, gates, QA loops and parallelism.
# Gate values here are binding (see AGENT_GUIDE.md → Gate protocol).

name: film
version: "1.0"
description: >
  Story idea → 2–7 minute film with on-screen speaking characters, assembled from
  ≤15-second AI clips. Thirteen stages plus stage 5b sound-direction (d-164), full Director gates,
  consistency enforced via locked descriptors + reference assets threaded through
  every generation call.

orchestration:
  mode: executive-producer
  skill: skills/stages/executive-producer.md
  max_revisions_per_stage: 3
  budget_gate_stages: [asset-generation, storyboard, video-generation]

stages:
  # ── Development ────────────────────────────────────────────────────────────
  - name: intake
    title: Conversational intake
    skill: skills/stages/01-intake-director.md
    produces: [brief]
    required_artifacts_in: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Story idea captured in the user's own words, not paraphrased away
      - Audience, duration, language, style, tone, platform all explicitly asked (one at a time), never assumed
      - Open questions listed rather than silently guessed
    success_criteria:
      - Schema-valid brief with all required fields
      - Duration target explicit and story-driven (30s minimum; NO upper ceiling — d-187/d-193, per-production at intake)

  - name: trend-scan
    title: Social trend scan (OPTIONAL)
    skill: skills/stages/01b-trend-scan-director.md
    produces: [trend_kit]
    required_artifacts_in: [brief]
    checkpoint_required: true
    human_approval_default: true   # two gates: trend selection, then integration plan
    optional: true                 # offered after intake, never assumed; skipped/untouched never blocks (d-192)
    review_focus:
      - Scout researched LIVE (dated sources, URLs in evidence) — never from model memory; 10 proposals spanning ≥4 kinds
      - Scout is STORY-BLIND (d-199) — no brief/bible/story input, no brand filter; internet-wide waves ranked by audience size, risks flagged as information; brand/IP safety is enforced at the weaver integration, never at research
      - Selection is the Director's alone; "none" is a first-class outcome recorded without argument
      - Integration passes the subtlety contract — story works for a trend-blind viewer; trend translated in-world, never quoted raw
      - Metadata placements decided per surface (tags, title, description, hashtags, thumbnail, trailer, teasers, spotlights) with deliberate blanks explained
    success_criteria:
      - Schema-valid trend_kit; selection recorded; integration block present when selection is non-empty

  - name: story
    title: Story writing (writer → refiner)
    skill: skills/stages/02-story-director.md
    produces: [story]
    required_artifacts_in: [brief]
    optional_artifacts_in: [trend_kit]   # when a trend was selected, the writer receives integration.story_plan (d-192)
    checkpoint_required: true
    human_approval_default: true
    qa_loop: {agent: refiner, min_rounds: 1, max_rounds: 3, blocking: true}
    review_focus:
      - Refiner pass performed — detail added, broken logic fixed, genre-appropriate emotion present
      - Beats sum to the brief's duration target (±10%)
      - Tone and audience fit the brief
      - Causal chain audit passed — every world/location entry+exit has an ON-SCREEN mechanism beat; naive retell test clean (d-191)
      - Conversation density at professional-animation level — multi-turn exchanges wherever characters share a beat; silence only as stated choice (d-191)
    success_criteria:
      - Schema-valid story with beats and per-beat duration estimates
      - estimated_runtime_seconds within duration target ±10%

  # ── Scene planning ─────────────────────────────────────────────────────────
  - name: scene-division
    title: Split story into ≤15s scene units
    skill: skills/stages/03-scene-division-director.md
    produces: [scene_list]
    required_artifacts_in: [story, brief]
    checkpoint_required: true
    human_approval_default: false   # flows directly into scene-recheck; the Director gates there
    review_focus:
      - Every scene ≤ 15 seconds (Seedance clip unit); dialogue lines fit inside their scene
      - Full story coverage — no beat dropped, no scene without a beat_ref
      - Dialogue kept inside scenes (native lipsync), speakers listed in characters_present
    success_criteria:
      - Schema-valid scene_list; every est_duration_seconds ≤ 15
      - total_est_seconds within duration target ±15%

  - name: scene-recheck
    title: Scene dedupe & continuity recheck
    skill: skills/stages/04-scene-recheck-director.md
    produces: [scene_list]
    required_artifacts_in: [scene_list, story]
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Fresh read against the FULL story — repeated/near-duplicate scenes merged or cut
      - Continuity fields (time_of_day, location_ref, characters_present) consistent scene-to-scene
      - recheck block filled — dedupe_report and fixed_issues honest, final=true
    success_criteria:
      - Schema-valid final scene_list with recheck.final == true

  - name: directing
    title: Per-scene direction
    skill: skills/stages/05-directing-director.md
    produces: [scene_direction, qa_review]
    required_artifacts_in: [scene_list, brief]
    checkpoint_required: true
    human_approval_default: true
    qa_loop: {agent: qa-reviewer, max_rounds: 3, blocking: true}
    parallel: {claude_subagent: director, unit: scene, max_parallel: 4}
    resume_unit: scene
    review_focus:
      - Camera movement executable by a 15s clip model (no impossible multi-move choreography)
      - Palette stated as hexes + name; lighting and mood concrete, not vibes
      - Blocking never contradicts scene_list continuity_notes or the 180° line
      - Boundary motion contract — every transition_out names the exit motion state AND how the next scene's opening absorbs it (d-191, generalizes d-158 to all boundaries)
    success_criteria:
      - Schema-valid scene_direction covering every scene
      - Blocking qa_review verdict == pass within 3 rounds

  - name: sound-direction
    title: Sound direction (baked vs post, vocal integrity)
    skill: skills/stages/05b-sound-direction-director.md
    produces: [sound_plan]
    required_artifacts_in: [scene_direction, scene_list, brief]
    optional_artifacts_in: [asset_manifest]   # locked voices when the stage runs retroactively (d-164)
    checkpoint_required: true
    human_approval_default: true
    optional: true                 # d-164: runs by default on every production; skipping is a Director ruling. optional=true only so productions that predate the stage (E01) are never blocked by it
    qa_loop: {agent: qa-reviewer, max_rounds: 2, blocking: true}
    parallel: {claude_subagent: sound-director, unit: scene, max_parallel: 3}
    resume_unit: scene
    review_focus:
      - Every sound class lives in exactly one half (baked by the video model / added by post) - no scored noun survives in any audio_block, every block ends with the no-music clause (d-103/d-164)
      - Vocal register map contiguous; register changes are story events; one voice reference per speaker film-wide
      - Every hinge names its J-cut seed on BOTH sides; boundary treatments match scene_list boundary_class_out
      - Protected silences deliberate and stated; post cue intents carry every scored intention the direction wrote
    success_criteria:
      - Schema-valid sound_plan covering every scene
      - qa_review verdict == pass within 2 rounds

  - name: lock-descriptors
    title: Extract consistency lock descriptors
    skill: skills/stages/06-lock-descriptors-director.md
    produces: [lock_descriptors, qa_review]
    required_artifacts_in: [scene_direction, scene_list, story]
    checkpoint_required: true
    human_approval_default: true
    qa_loop: {agent: qa-reviewer, max_rounds: 3, blocking: true}
    review_focus:
      - Every character has 3–6 identity anchors usable VERBATIM in prompts, unambiguous and visual
      - Face/body/age are static_features; clothing is dynamic (default + per-scene outfits)
      - voice_spec matches the character's role and the story's style; every speaker covered
      - Objects and locations that recur are captured with anchors and scene refs
    success_criteria:
      - Schema-valid lock_descriptors; every scene's characters_present resolvable to a char_id
      - Blocking qa_review verdict == pass within 3 rounds

  # ── Asset production ───────────────────────────────────────────────────────
  - name: asset-generation
    title: Generate & lock reference assets
    skill: skills/stages/07-asset-generation-director.md
    produces: [asset_manifest]
    required_artifacts_in: [lock_descriptors]
    checkpoint_required: true
    human_approval_default: true   # the Director PICKS one variant per element → locked
    resume_unit: element
    review_focus:
      - ~2 variants per character sheet (multi-view), environment plate and voice sample
      - Each variant generated FROM the descriptors — anchors verbatim in prompts
      - Gallery built so the Director compares variants side by side
      - Voice samples audition the character's voice_spec on a neutral line + an emotional line
    success_criteria:
      - Schema-valid asset_manifest; every element has ≥2 variants with provenance (model, prompt, seed)
      - After the gate — every element locked with a selected_variant_id

  - name: storyboard
    title: Storyboards (2 grid pages/scene, cherry-pick)
    skill: skills/stages/08-storyboard-director.md
    produces: [storyboard_set, shot_selection]
    required_artifacts_in: [asset_manifest, scene_direction, lock_descriptors, scene_list]
    checkpoint_required: true
    optional: true   # d-029: Director may skip straight to video-generation and test clip quality
                      # from locked sheets + scene_direction text alone, no keyframe conditioning;
                      # storyboards remain available to run later if clip quality warrants it
    human_approval_default: true   # the Director cherry-picks shots across variants
    parallel: {claude_subagent: storyboard-artist, unit: scene_variant, max_parallel: 2}
    resume_unit: scene_variant
    review_focus:
      - 2 genuinely different approaches per scene (coverage-first vs energy-first), not rerolls
      - Every frame conditioned on LOCKED assets only; refs_used recorded
      - Start/end-frame candidates flagged; adjacent scenes remain chainable
    success_criteria:
      - Schema-valid storyboard_set (2 grid-page variants per scene, Director rule d-043/d-044) and shot_selection
      - After the gate — every scene has selected frames incl. start_frame and end_frame roles

  # ── Film production ────────────────────────────────────────────────────────
  - name: video-generation
    title: Generate scene clips
    skill: skills/stages/09-video-generation-director.md
    produces: [generation_manifest, clip_qc_report]
    required_artifacts_in: [lock_descriptors, asset_manifest, scene_list, scene_direction]
    optional_artifacts_in: [shot_selection, storyboard_set, sound_plan]   # d-164: sound_plan.baked.audio_block is pasted verbatim (STOP and report if absent); d-029: present + used for keyframe/
      # start-end-frame conditioning when stage 8 ran; when storyboard was skipped, clip-producer
      # conditions directly on locked sheets (image_references) + full text prompt (anchors verbatim)
      # instead of a start_frame/keyframe — see skills/stages/09-video-generation-director.md
    checkpoint_required: true
    human_approval_default: true   # per scene batch
    qa_loop: {agent: clip-evaluator, max_rounds: 3, blocking: false, optional: true}   # d-137: evaluator runs ONLY on Director request; d-114: findings REPORT only — every regen attempt requires the Director to check the clip and explicitly order it; max_rounds bounds Director-ORDERED regens, not autonomous ones
    parallel: {claude_subagent: clip-producer, unit: clip, max_parallel: 1}   # d-137: producer is end-to-end per clip (folds prompt-smith); d-112 chaining forces sequential generation within a chain group — parallelism only across hard-hinge groups, and each clip still gates before the next (d-114)
    optional_subagents: [clip-evaluator, virality-checker]   # d-137 parts 3-4, skipped unless the Director asks; virality is out-of-pipeline (Director ruling 2026-07-27)
    resume_unit: clip
    review_focus:
      - Model chosen via config/model_capabilities.yaml; DIALOGUE SCENES ONLY on models satisfying policy.dialogue_scene_requires
      - Every prompt embeds identity anchors verbatim, quoted dialogue lines, 200–1000 words (Seedance, d-138)
      - References threaded — locked sheets/plates (≤9 images), start frame @-named per d-124/d-127, end frames where pinned, locked voice reference_audio for every speaker
      - Every generated clip presented at the per-clip Director gate with the producer report; evaluator (when requested) checked identity/continuity/lipsync with native-res verification (d-114)
      - Handoff beat present — each chained clip's final second settles into a describable state, and the successor's 0-2s bridge continues the inherited motion (d-191)
    success_criteria:
      - Schema-valid generation_manifest + clip_qc_report
      - Every clip status == approved (QC pass + Director batch approval)

  - name: integration
    title: Assembly, sound & delivery
    skill: skills/stages/10-integration-director.md
    produces: [edit_decisions, audio_direction, render_report]
    required_artifacts_in: [generation_manifest, clip_qc_report, scene_direction, scene_list, brief]
    optional_artifacts_in: [sound_plan]   # d-164: Phase 2 derives audio_direction from sound_plan.global.score_intent + scenes[].post
    checkpoint_required: true
    human_approval_default: true   # approve final cut before rendering deliverables
    qa_loop: {agent: qc-critic, max_rounds: 2, blocking: true}   # watch-through of assembled cut
    resume_unit: preset
    review_focus:
      - Transitions follow scene_direction / transition_out_hint — not uniform crossfades
      - Seam pass done — every boundary classified (continuous / new-beat / hinge), motion-matched via micro-trims, soft-cut applied where a continuous seam still jumps; watch-through scores every seam for visibility (d-191)
      - audio_direction authored and Director-approved ON PAPER before any cue is generated (score architecture, timecoded cue sheets citing sound_direction lines, protected silences, mix plan, main-theme audition)
      - Music + SFX generated to the brief's music_direction; dialogue never buried (ducking applied)
      - Captions per brief language; every deliverable preset from config/delivery_presets.yaml
      - Final watch-through QC ran on the assembled cut before the gate
    success_criteria:
      - Schema-valid edit_decisions + render_report; ffprobe_ok true for every output
      - render_report.final_qc.verdict == pass

  # ── Publishing ─────────────────────────────────────────────────────────────
  - name: publishing
    title: Publishing kit (thumbnail + trailer + metadata)
    skill: skills/stages/11-publishing-director.md
    produces: [publishing_kit]
    required_artifacts_in: [brief, story, scene_list, asset_manifest, generation_manifest, render_report]
    checkpoint_required: true
    human_approval_default: true   # Director approves the thumbnail AND all copy; nothing is posted by Claude
    parallel: {claude_subagent: thumbnail-artist, unit: concept, max_parallel: 2}
    resume_unit: concept
    review_focus:
      - Thumbnail concepts follow skills/tech/thumbnail-design — one curiosity strategy each, prompts SAVED in the artifact BEFORE generation (d-114 gates every paid call)
      - Characters in the thumbnail conditioned on LOCKED sheets (@-named references, anchors verbatim), never text alone
      - Metadata per skills/tech/youtube-publishing — title options with distinct angles, standalone 125-char hook, ≤15 hashtags, title never echoing the on-image text
      - made_for_kids and platform flags presented as explicit Director decisions, never defaulted
      - Active trend_kit placements applied across title/tags/description/hashtags/thumbnail/trailer/teasers — after re-verifying the trend is still live; stale placements dropped with a note (d-192)
      - Trailer per skills/tech/trailer-design — cut-list over APPROVED clips only, spoiler law applied (resolution beats excluded, spoiler_check recorded), 15–30s, works muted
    success_criteria:
      - Schema-valid publishing_kit with selected_concept_id, selected_title, and an upload-ready delivery_path
      - Every generated thumbnail passed the 168x94 stamp-legibility QC and identity check against locked sheets
      - Trailer approved with status approved, output_path present, and no resolution beat in its cut-list

  # ── Post-release (OPTIONAL) ────────────────────────────────────────────────
  - name: character-spotlight
    title: Character spotlight videos (SJinn talking characters + b-roll)
    skill: skills/stages/12-character-spotlight-director.md
    produces: [spotlight_kit]
    required_artifacts_in: [brief, story, lock_descriptors, asset_manifest, generation_manifest, publishing_kit]
    checkpoint_required: true
    human_approval_default: true   # per-video Director gates; the stage itself may be skipped entirely
    optional: true                 # the Director may reject this stage — 'skipped' status closes it
    parallel: {claude_subagent: spotlight-writer, unit: video, max_parallel: 1}
    resume_unit: video
    review_focus:
      - Stage offered, never assumed — the Director explicitly opts in or the stage is written skipped
      - "Per-video intake asked in chat before ANY authoring: subject, short description, target length (>=45s), characters, platforms, tone/CTA"
      - Dialogue written IN CHARACTER from lock_descriptors (anchors, personality, speech patterns) by the spotlight-writer subagent, which reads brief/story/scene_list/lock_descriptors/publishing_kit before writing a line
      - Script + full SJinn request payload SAVED into spotlight_kit BEFORE any generation (d-114 gates every paid call; SJinn has no cost preflight — unit price measured by a Director-gated probe + balance delta before any batch)
      - B-roll only from APPROVED film clips; NO next-episode/next-session mention in any script unless the Director explicitly orders one (d-184); spoiler law applies
      - B-roll voiceovers voiced by CLONING from the character's in-video segment audio, never raw TTS presets (d-184 — the VO must match the voice the viewer just heard)
      - Each video >=45 seconds of content; per-platform deliverables cut with the free ffmpeg recipes (platform-publishing skill)
      - The loop is open-ended — after each approved video, ask whether the Director wants another (different characters/subject) or wants the stage closed
    success_criteria:
      - Schema-valid spotlight_kit; every video entry has its script and saved generation payload with status approved before the stage completes
      - Every delivered video >= 45s (ffprobe-verified) with platform variants under delivery/<platform>/spotlights/
      - Stage closes only on the Director's word — completed --approved after the last video, or skipped if the Director declines the stage

  - name: dub-pass
    title: Multi-language dub pass (OPTIONAL)
    skill: skills/stages/13-dub-pass-director.md
    produces: [dub_kit]
    required_artifacts_in: [render_report]
    checkpoint_required: true
    human_approval_default: true   # per-language Director gates (d-114); the stage itself may be skipped
    optional: true                 # offered after publishing/spotlights, repeatable for more languages (d-196)
    resume_unit: language
    review_focus:
      - Backend law (d-195/d-196) — YouTube dubs are ElevenLabs AUDIO TRACKS on the ONE existing upload, never re-uploads; Higgsfield lip-sync dubs only for TikTok/IG verticals
      - Language availability verified LIVE against the backend; unsupported languages recorded unavailable, never silently dropped
      - "First language of a session is the pricing probe: real credit burn measured before any batch; quota headroom checked before proposing"
      - Character names and catchphrases survive translation recognizably; family tone register QC'd per language
      - Delivery per language complete - audio track + translated srt + localized title/description under delivery/youtube/audio_tracks/<lang>/
    success_criteria:
      - Schema-valid dub_kit; every language entry approved, rejected, or unavailable — nothing half-generated
      - Approved languages delivered upload-ready for YouTube multi-language audio + metadata localization
